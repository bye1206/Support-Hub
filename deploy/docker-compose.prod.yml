name: support-hub-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_hub}
      POSTGRES_USER: ${POSTGRES_USER:-support_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No host port: the DB is reachable only inside the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_hub} -d ${POSTGRES_DB:-support_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      # Inside compose the services talk by name; the .env keeps the
      # host-facing values for the AI gateway / Mattermost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-support_hub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-support_hub}
      REDIS_URL: redis://redis:6379/0
      # Mattermost must reach the rating buttons through the VM IP.
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL=http://<vm-ip>:<port> in .env}
      FILES_DIR: /data/files
    ports:
      # 8000 belongs to the AI orchestrator on this VM.
      - "${API_PORT:-8010}:8000"
    volumes:
      - filesdata:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker.main"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-support_hub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-support_hub}
      REDIS_URL: redis://redis:6379/0
      FILES_DIR: /data/files
    volumes:
      - filesdata:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8011}:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  filesdata:
